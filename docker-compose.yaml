networks:
  default:
    name: vroomly
    external: true

volumes:
  vroomly-postgres-data:
    external: true


services:
  db:
    image: postgres:17.4
    restart: always
    env_file: .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - ${EXPOSE_DB_PORT:-5432}:5432
    volumes:
      - vroomly-postgres-data:/var/lib/postgresql/data:rw
    networks:
      default:
        aliases: [ vroomly-db ]
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G

  backend-build:  &backend-build
    build: &backend-build-path ./backend
    env_file: .env
    volumes:
      - &app-backend ./backend:/app:rw
      - .git:/app/.git
    ports:
      - ${EXPOSE_BACKEND_PORT:-8000}:${BACKEND_PORT:-8000}
    depends_on:
      - db
      - libretranslate
    user: "${UID}:${GID}"
    restart: unless-stopped
    profiles: [ no-profile ]
    networks:
      default:
        aliases: [ vroomly-backend ]
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G

  backend:
    <<: *backend-build
    command: uv run python main.py
    profiles: [ vr-backend, vr-frontend ]

  migrations:
    build: *backend-build-path
    command: uv run alembic upgrade head
    env_file: .env
    volumes:
      - *app-backend
    depends_on:
      - db
    restart: no
    profiles: [ vr-frontend ]

  seed: # Наполнение БД первичными данными
    build: *backend-build-path
    command: uv run python default_data/seed_all.py
    env_file: .env
    volumes:
      - *app-backend
    depends_on:
      - db
    restart: no
    profiles: [ no-profiles ]

  libretranslate:
    image: libretranslate/libretranslate
    environment:
      LT_LOAD_ONLY: ru,en
    ports:
      - 5000:${LIBRETRANSLATE_PORT:-5000}
    networks:
      default:
        aliases: [ $LIBRETRANSLATE_HOST ]
    restart: unless-stopped
