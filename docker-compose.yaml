networks:
  default:
    name: vroomly
    external: true

volumes:
  vroomly-postgres-data:
    external: true

services:
  db:
    image: postgres:17.4
    restart: on-failure
    env_file: .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - ${EXPOSE_DB_PORT:-5432}:5432
    volumes:
      - vroomly-postgres-data:/var/lib/postgresql/data:rw
      - ./backend/scripts/:/app/scripts/
    networks:
      default:
        aliases: [ vroomly-db ]
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - UID=${UID:-1000}
        - GID=${GID:-1000}
    env_file: .env
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app:rw
    profiles: [ vr-frontend, vr-backend ]
    user: ${FRONTEND_USER:-node}
    command: bash -c "npm install && npm run dev"
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G


  backend-build:  &backend-build
    build: &backend-build-context
      context: ./backend
      target:  backend-base
      args:
        - UID=${UID:-1000}
        - GID=${GID:-1000}
    env_file: .env
    volumes:
      - &app-backend ./backend:/app:rw
    ports:
      - ${EXPOSE_BACKEND_PORT:-8000}:${BACKEND_PORT:-8000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - db
      - libretranslate
    restart: unless-stopped
    working_dir: /app
    profiles: [ vr-backend ]
    networks:
      default:
        aliases: [ vroomly-backend ]
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G

  backend:
    <<: *backend-build
    command: python main.py
    profiles: [ vr-frontend ]

  codegen:
    build:
      context: ./backend
      target: codegen
      args:
        - UID=${UID:-1000}
        - GID=${GID:-1000}
    env_file: .env
    restart: no
    volumes:
      - *app-backend
      - ./frontend/src:/frontend/src:rw
    command: sleep infinity
    profiles: [ vr-frontend, vr-backend ]
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G

  migrations:
    build: *backend-build-context
    command: alembic upgrade head
    env_file: .env
    volumes:
      - *app-backend
    depends_on:
      - db
    restart: no
    profiles: [ vr-frontend ]

  seed: # Наполнение БД первичными данными
    build: *backend-build-context
    command: python default_data/seed_all.py
    env_file: .env
    volumes:
      - *app-backend
    depends_on:
      - db
    restart: no
    profiles: [ no-profiles ]

  tests: # тесты бекенда
    build: *backend-build-context
    command: pytest
    env_file: .env
    environment:
      PYTHONOPTIMIZE: 0
    volumes:
      - *app-backend
    depends_on:
      - db
    restart: no
    profiles: [ no-profiles ]

  linters: # ruff + ty linting
    build: *backend-build-context
    command: bash -c "ruff check . && ruff format --check . && ty check ."
    env_file: .env
    volumes:
      - *app-backend
    restart: no
    profiles: [ no-profiles ]

  libretranslate:
    image: libretranslate/libretranslate
    environment:
      LT_LOAD_ONLY: ru,en
    ports:
      - 5000:${LIBRETRANSLATE_PORT:-5000}
    networks:
      default:
        aliases: [ $LIBRETRANSLATE_HOST ]
    restart: on-failure
