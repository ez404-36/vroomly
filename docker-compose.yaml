networks:
  default:
    name: vroomly
    external: true

volumes:
  vroomly-postgres-data:
    external: true
  vroomly-backend-venv:


services:
  db:
    image: postgres:17.4
    restart: always
    env_file: .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - ${EXPOSE_DB_PORT:-5432}:5432
    volumes:
      - vroomly-postgres-data:/var/lib/postgresql/data:rw
      - ./backend/scripts/:/app/scripts/
    networks:
      default:
        aliases: [ vroomly-db ]
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G

  backend-build:  &backend-build
    build: &backend-build-context
      context: ./backend
      target:  backend-base
      args:
        - UID=${UID:-1000}
        - GID=${GID:-1000}
    env_file: .env
    volumes:
      - &app-backend ./backend:/app:rw
      - &backend-venv vroomly-backend-venv:/app/.venv
      - .git:/app/.git
    ports:
      - ${EXPOSE_BACKEND_PORT:-8000}:${BACKEND_PORT:-8000}
    depends_on:
      - db
      - libretranslate
    restart: unless-stopped
    profiles: [ vr-backend ]
    working_dir: "/app"
    networks:
      default:
        aliases: [ vroomly-backend ]
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G

  backend:
    <<: *backend-build
    command: python main.py
    profiles: [ vr-frontend ]

  codegen:
    build:
      context: ./backend
      target: codegen
      args:
        - UID=${UID:-1000}
        - GID=${GID:-1000}
    env_file: .env
    working_dir: "/app"
    restart: no
    volumes:
      - *app-backend
      - *backend-venv
      - ./frontend/src:/frontend/src:rw
    command: python scripts/collect_models.py
    profiles: [ vr-frontend, vr-backend ]
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G

  migrations:
    build: *backend-build-context
    command: alembic upgrade head
    env_file: .env
    volumes:
      - *app-backend
      - *backend-venv
    depends_on:
      - db
    restart: no
    profiles: [ vr-frontend ]

  seed: # Наполнение БД первичными данными
    build: *backend-build-context
    command: python default_data/seed_all.py
    env_file: .env
    volumes:
      - *app-backend
      - *backend-venv
    depends_on:
      - db
    restart: no
    profiles: [ no-profiles ]

  tests: # тесты бекенда
    build: *backend-build-context
    command: pytest
    env_file: .env
    environment:
      PYTHONOPTIMIZE: 0
    volumes:
      - *app-backend
      - *backend-venv
    depends_on:
      - db
    restart: no
    profiles: [ no-profiles ]

  libretranslate:
    image: libretranslate/libretranslate
    environment:
      LT_LOAD_ONLY: ru,en
    ports:
      - 5000:${LIBRETRANSLATE_PORT:-5000}
    networks:
      default:
        aliases: [ $LIBRETRANSLATE_HOST ]
    restart: unless-stopped
